org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
# AGP 8.3+ 已移除 android.enableDexingArtifactTransform。改用下方开关：
# 让 dexing transform 使用完整 classpath，避免模块类被拆分到 classes2.dex，
# 从而防止 LSPosed 只扫主 dex 时入口类 (MainHook) ClassNotFound、
# 模块静默加载失败（表现为"已启用但毫无反应、也没有任何日志"）。
android.useFullClasspathForDexingTransform=true
