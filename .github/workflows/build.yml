name: Build XHSFullscreen LSPosed Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # LSPosed 在 zygote 里 Class.newInstance() 实例化模块入口类，此时
      # Looper.getMainLooper() 还是 null。入口类的静态初始化只要碰到
      # Handler/Looper/Context 就会 ExceptionInInitializerError，
      # 整个模块在所有进程加载失败 —— 症状是「装了、勾了、但毫无反应且零日志」。
      - name: Guard - entry class static init must not touch Android runtime
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path('app/src/main/java/com/abel/xhsfullscreen/MainHook.java').read_text(encoding='utf-8')
          code = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
          code = re.sub(r'//[^\n]*', '', code)
          # 静态字段声明里直接构造 Android 运行时对象
          PAT = re.compile(
              r'static\s+(?:final\s+)?[A-Za-z0-9_.<>\[\]]+\s+\w+\s*=\s*'
              r'(?:new\s+(?:Handler|HandlerThread)\b|Looper\.|.*getMainLooper\(\))')
          bad = False
          for i, line in enumerate(code.splitlines(), 1):
              if PAT.search(line):
                  print('::error::MainHook.java:%d 静态初始化触碰 Android 运行时，'
                        'zygote 阶段必崩 -> %s' % (i, line.strip()))
                  bad = True
          if re.search(r'static\s*\{', code):
              print('::warning::MainHook 存在 static{} 块，请人工确认未触碰 Handler/Looper/Context')
          print('OK: 入口类静态初始化是 zygote 安全的' if not bad else 'GUARD FAILED')
          sys.exit(1 if bad else 0)
          PY

      # API 102 硬约束：模块内禁止调用 legacy de.robv.android.xposed.* API，
      # 否则加载即失败。
      - name: Guard - MainHook must not use legacy Xposed API
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path('app/src/main/java/com/abel/xhsfullscreen/MainHook.java').read_text(encoding='utf-8')
          code = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
          code = re.sub(r'//[^\n]*', '', code)
          PAT = re.compile(r'de\.robv\.android\.xposed|XposedBridge|XposedHelpers|IXposedHookLoadPackage|XC_MethodHook|XC_LoadPackage')
          bad = False
          for i, line in enumerate(code.splitlines(), 1):
              if PAT.search(line):
                  print('::error::MainHook.java:%d 引用了 legacy Xposed API，API 102 禁止 -> %s'
                        % (i, line.strip()))
                  bad = True
          print('OK: MainHook 纯 LibXposed API' if not bad else 'GUARD FAILED')
          sys.exit(1 if bad else 0)
          PY

      # 防回归：v1 用「measuredWidth < 98% 屏宽」在整棵内容树上强制
      # requestLayout()，中间测量值被误判 → 首帧窄、随后弹回设定宽度。
      # 这条守卫确保该兜底扫描不会被重新引入。
      - name: Guard - no whole-tree requestLayout heuristic (flicker regression)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path('app/src/main/java/com/abel/xhsfullscreen/MainHook.java').read_text(encoding='utf-8')
          code = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
          code = re.sub(r'//[^\n]*', '', code)
          bad = False
          PATS = [
              (re.compile(r'FILL_THRESHOLD'), 'FILL_THRESHOLD 兜底阈值（会造成首帧窄+弹回）'),
              (re.compile(r'getMeasuredWidth\s*\(\s*\)'), 'getMeasuredWidth() 中间值判断'),
              (re.compile(r'clearMaxWidth'), 'clearMaxWidth 反射兜底'),
          ]
          for i, line in enumerate(code.splitlines(), 1):
              for pat, why in PATS:
                  if pat.search(line):
                      print('::error::MainHook.java:%d 重新引入了抖动兜底逻辑（%s）-> %s'
                            % (i, why, line.strip()))
                      bad = True
          print('OK: 未引入全树兜底扫描' if not bad else 'GUARD FAILED')
          sys.exit(1 if bad else 0)
          PY

      - name: Build debug APK (fixed keystore)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.5
          build-root-directory: .
          arguments: :app:assembleDebug

      # LibXposed 部分实现加载模块只扫主 dex，入口类必须在 classes.dex 里。
      # 出现 classes2.dex 就直接让构建失败，避免又产出一个"装了没反应"的包。
      - name: Verify single-dex & entry class
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK = $APK"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex|META-INF/xposed/'
          if unzip -l "$APK" | grep -q 'classes2.dex'; then
            echo "::error::APK 被拆成多个 dex，入口类可能不在主 dex，LSPosed 会加载失败"
            exit 1
          fi
          for f in module.prop java_init.list scope.list; do
            if ! unzip -l "$APK" | grep -q "META-INF/xposed/$f"; then
              echo "::error::APK 缺少 META-INF/xposed/$f，LibXposed 无法识别模块"
              exit 1
            fi
          done
          unzip -p "$APK" classes.dex > /tmp/c.dex
          if ! grep -q 'com/abel/xhsfullscreen/MainHook' /tmp/c.dex; then
            echo "::error::主 dex 中找不到 MainHook 入口类"
            exit 1
          fi
          echo "OK: 单 dex，MainHook 在主 dex，META-INF/xposed 三件套齐全"
          echo "--- 签名指纹（应每次构建都一致，保证可覆盖安装）---"
          unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -E 'SHA1|SHA256' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XHSFullscreen-apk
          path: app/build/outputs/apk/debug/*.apk
